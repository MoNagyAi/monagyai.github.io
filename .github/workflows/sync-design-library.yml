name: Sync Free Design Library from Google Drive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gdown
        run: python -m pip install --upgrade gdown

      - name: Download Drive folder
        run: |
          rm -rf _drive_download
          mkdir -p _drive_download
          cd _drive_download
          gdown --folder 'https://drive.google.com/drive/folders/1bfG5feMM9CMpiBbYwP8jnUqy1IDfSN9m?usp=drive_link' --remaining-ok

      - name: Publish HTML files
        shell: bash
        run: |
          set -e
          rm -rf free-design-library
          mkdir -p free-design-library
          find _drive_download -type f -iname '*.html' -exec cp -f '{}' free-design-library/ \;

          if [ ! -f free-design-library/index.html ]; then
            echo 'index.html not found'
            exit 1
          fi

      - name: Remove excluded paid sections from index
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          p = Path('free-design-library/index.html')
          text = p.read_text(encoding='utf-8')
          m = re.search(r"const\s+folderGroupsData\s*=\s*(\{.*?\});\s*let\s+currentGroup", text, re.S)
          if not m:
              raise SystemExit('folderGroupsData not found')
          data = json.loads(m.group(1))
          for key in ['درايف الكورسات المدفوعة','درايف البرامج المفعلة','درايف البيانات التسويقية']:
              data.pop(key, None)
          replacement = 'const folderGroupsData = ' + json.dumps(data, ensure_ascii=False) + ';\n                let currentGroup'
          text = text[:m.start()] + replacement + text[m.end():]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add free-design-library
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Sync Free Design Library from Google Drive'
            git push
          fi
